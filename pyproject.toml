[project]
name = "devrank"
version = "0.1.0"
description = "DevRank: SaaS for vetting candidates through scenario-based interviews and impact assessment"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "celery[redis]>=5.3.6",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    # Hygiene (pre-commit hooks): latest as of 2026
    "pre-commit>=4.1.0",
    "ruff>=0.11.4",
    "mypy>=1.15.0",
]

# Ruff: fast Python linter/formatter (replaces flake8/isort/black)
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "W",  # Standard: errors, pyflakes, isort, warnings
    "UP", "SIM", "B", "C4",  # Modernize, simplify, bugbear, comprehensions
    "ANN",  # Type annotations
]
ignore = ["E501"]  # Line length handled by formatter
format = { quote-style = "double" }

# Mypy: static type checking
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "samples/"]
