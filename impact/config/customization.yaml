# Organisation-level customisation for language- and provider-neutral metrics.
# These extend (not replace) the built-in defaults in impact/metrics/utils.py
# and impact/metrics/plugins/authored/pr_category_diversity.py.
#
# Copy this file to your workspace or mount it into the container, then set
# DEVRANK_CUSTOMIZATION_PATH to override the default location.
#
# All lists are additive — built-in values are always present.

# ---------------------------------------------------------------------------
# Generated-file detection (§1.7)
# ---------------------------------------------------------------------------
# Additional header markers for generated-file detection.
# Added to the built-in tool-convention markers (@generated, @auto-generated,
# @autogenerated) and the English secondary markers.
# Use this for non-English codegen headers your toolchain emits.
extra_generated_markers: []
  # - "自動生成"          # Japanese: "auto-generated"
  # - "nicht bearbeiten"  # German: "do not edit"
  # - "ne pas modifier"   # French: "do not modify"
  # - "自动生成"          # Simplified Chinese

# ---------------------------------------------------------------------------
# Documentation directory detection (§1.8)
# ---------------------------------------------------------------------------
# Additional directory prefixes treated as documentation paths.
# Added to the built-in set (docs/, doc/, documentation/, wiki/, guides/, manual/).
extra_doc_dirs: []
  # - "ドキュメント/"     # Japanese
  # - "Dokumentation/"    # German
  # - "documentacao/"     # Portuguese

# ---------------------------------------------------------------------------
# Bug-fix label detection (§1.1)
# ---------------------------------------------------------------------------
# Additional labels that indicate a bug-fix PR.
# Merged (case-insensitive) with the built-in set:
#   bug, fix, hotfix, bugfix, type:bug, type:fix, kind/bug, kind/fix,
#   type/bug, type/fix, priority/critical, defect, regression
extra_bug_labels: []
  # - "バグ"              # Japanese: "bug"
  # - "Fehler"            # German: "error/bug"
  # - "correctif"         # French: "fix"

# ---------------------------------------------------------------------------
# Defect commit label detection (§1.4)
# ---------------------------------------------------------------------------
# Additional labels that indicate a defect-related commit/PR.
# Merged with the built-in set:
#   bug, defect, type:bug, kind/bug, incident, hotfix, regression, type:defect
extra_defect_labels: []

# ---------------------------------------------------------------------------
# PR category diversity — label-to-category mapping (§2.4)
# ---------------------------------------------------------------------------
# Additional label-to-category mappings for _classify_pr().
# Keys are label names (matched case-insensitively); values are category slugs
# (fix, feat, refactor, docs, test, ci, chore, perf, style).
extra_label_to_category: {}
  # "バグ修正": "fix"
  # "機能追加": "feat"
  # "リファクタリング": "refactor"
  # "ドキュメント": "docs"
  # "Fehler": "fix"
  # "Funktion": "feat"
