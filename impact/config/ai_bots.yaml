# Known AI code review bot logins (GitHub user.login values).
# Update this list without code changes when new bots appear.
#
# Detection method: review comments with ```suggestion blocks from these logins
# are treated as AI suggestions. Additionally, any login ending with [bot] is
# treated as a bot regardless of this list.
#
# Known limitations:
#   - False positives: PR titles mentioning "copilot" (e.g. "Fix copilot page")
#     do NOT affect this list (it only matches review comment authors).
#   - False negatives: Local AI tools (Cursor, Cody) that don't leave
#     review comments cannot be detected from GitHub API data.
#   - The [bot] suffix catch-all may match non-AI bots (e.g. dependabot).

ai_review_bots:
  - copilot
  - copilot-pull-request-reviewer[bot]
  - codeant-ai-for-open-source[bot]
  - bito-code-review[bot]
  - korbit-ai[bot]
  - codewhisperer[bot]
  - tabnine[bot]
  - sourcery-ai[bot]
  - codium-ai[bot]

# Logins checked case-insensitively. The [bot] suffix rule also applies
# to any login not in this list.
