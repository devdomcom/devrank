# Senior Software Engineer role — thresholds tuned for experienced IC expectations.
# Each metric defines: key (details field), direction, rating bounds, score breakpoints, allowed_ratings.
# Direction: lower_is_better | higher_is_better | band
# To create a new role, copy this file and adjust thresholds/allowed_ratings.

