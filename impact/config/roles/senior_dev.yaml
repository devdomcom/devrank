# Senior Software Engineer role — thresholds tuned for experienced IC expectations.
# Each metric defines: key (details field), direction, rating bounds, score breakpoints, allowed_ratings.
# Direction: lower_is_better | higher_is_better | band
# To create a new role, copy this file and adjust thresholds/allowed_ratings.
#
# ORG-DEPENDENT METRICS
# ---------------------
# Some metrics reflect org policy or culture more than individual skill.
# These are marked `no_rating: true` (descriptive only) in this default config
# so they appear in reports as data without affecting the engineer's rating.
# Override per-org by creating a custom role file with `no_rating: false` and
# appropriate thresholds for metrics that ARE meaningful in your org.
#
# Org-dependent metrics in this config:
#   - self_merge_rate:             Org may forbid self-merge (everyone 0%)
#   - co_author_contribution_rate: Org may not use Co-authored-by trailers
#   - conventional_commit_rate:    Org may not enforce conventional commits
#   - blocking_comment_rate:       "Right" blocking rate varies by review culture
#   - review_leverage:             Depends on org formally using change requests
#   - first_time_approval_rate:    Multi-approval policies skew this metric
#
# CATEGORY WEIGHTS (optional)
# ---------------------------
# By default all 6 scored categories get equal weight (1.0 each).
# Uncomment and adjust to emphasize dimensions that matter for your context.
# Weights are relative — only their ratio matters. Omitted categories default to 1.0.
#
# category_weights:
#   delivery_velocity: 2.0       # emphasize output volume & speed
#   code_quality: 1.5            # code quality matters more than process
#   process_discipline: 1.0
#   responsiveness: 1.0
#   review_impact: 0.5           # de-emphasize if candidates lack review activity
#   review_effectiveness: 0.5

slug: senior_dev
description: Senior Software Engineer role (platform defaults)
status: PUBLISHED
global_role: true
version: 1

metrics:

