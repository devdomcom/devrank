# RBAC permission definitions and default role-permission mappings.
#
# Source of truth for the permission system. Used by:
#   - scripts/init_rbac.py       (seeds DB with permissions + role mappings)
#   - api/auth/rbac/             (runtime loader for validation)
#   - require_permission()       (FastAPI dependency factory in api/auth/dependencies.py)
#
# Permission slugs follow the resource:action convention (e.g. metrics:read).
# To add a new permission: add it under `permissions:`, then assign it to
# the appropriate role(s) under `roles:`.

permissions:
  metrics:list:
    description: List available metrics catalog
  metrics:read:
    description: Read individual metric results
  metrics:compute:
    description: Compute metrics reports and comparisons
  roles:list:
    description: List available role configurations
  roles:read:
    description: Read role configuration details
  dumps:upload:
    description: Upload and validate dump ZIP files
  system:debug:
    description: Access debug and test endpoints
  # Organizations endpoint (platform tenancy).
  # - list: system roles only (superuser *)
  # - read: system roles + org admins (app role, ORG scope for tenancy enforcement)
  # - create: available to all users/roles (beyond system/app; assigned broadly)
  # Follows resource:action; source-of-truth for RBAC in deps/scripts.
  organizations:list:
    description: List all organizations in the platform (system roles only)
  organizations:read:
    description: Read specific organization details by ID/slug (system roles or org admins)
  organizations:create:
    description: Create a new organization (available to all users irrespective of role)

roles:
  superuser:
    type: system
    name: Superuser
    description: Full system-wide access to all features
    permissions: "*"

  analyst:
    type: app
    scope: ORG
    name: Analyst
    description: Read-only access to metrics and roles
    permissions:
      - metrics:list
      - metrics:read
      - metrics:compute
      - roles:list
      - roles:read
      # organizations:create added for all users/roles (beyond system/app; broad access)

  # Org admin: app role (ORG scope) for tenancy access (e.g., read own org details).
  # Complements system roles; enforced via UserRoleAssignment.org_id match in deps.
  org_admin:
    type: app
    scope: ORG
    name: Org Admin
    description: Org-scoped admin for tenancy management (read org details)
    permissions:
      - organizations:read
      # organizations:create added; extend for org-specific actions (depts, users etc.)

# Note: organizations:create assigned to analyst/org_admin (and superuser via *) so
# available to all users irrespective of role , per task. Re-seed DB via init_rbac.py.
