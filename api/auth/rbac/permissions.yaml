# RBAC permission definitions and default role-permission mappings.
#
# Source of truth for the permission system. Used by:
#   - scripts/init_rbac.py       (seeds DB with permissions + role mappings)
#   - api/auth/rbac/             (runtime loader for validation)
#   - require_permission()       (FastAPI dependency factory in api/auth/dependencies.py)
#
# Permission slugs follow the resource:action convention (e.g. metrics:read).
# To add a new permission: add it under `permissions:`, then assign it to
# the appropriate role(s) under `roles:`.

permissions:
  metrics:list:
    description: List available metrics catalog
  metrics:read:
    description: Read individual metric results
  metrics:compute:
    description: Compute metrics reports and comparisons
  roles:list:
    description: List available role configurations
  roles:read:
    description: Read role configuration details
  dumps:upload:
    description: Upload and validate dump ZIP files
  system:debug:
    description: Access debug and test endpoints
  organizations:list:
    description: List all organizations in the platform (system roles only)
  organizations:read:
    description: Read specific organization details by ID/slug
  organizations:update:
    description: Update an existing organization's properties (org admins / superusers)
  organizations:delete:
    description: Soft-delete an organization (org admins / superusers)
  organizations:create:
    description: Create a new organization (all authenticated users)
  departments:list:
    description: List departments within an organization (org members / superusers)
  departments:read:
    description: Read specific department details by ID/slug
  departments:update:
    description: Update department properties (org admins / dept admins / superusers)
  departments:create:
    description: Create a new department within an organization (org admins / superusers)
  departments:set-default:
    description: Designate a department as the org default, transferring the flag from the current default (org admins / superusers only)
  departments:delete:
    description: Soft-delete a department (org admins / dept admins / superusers)

roles:
  # ── System roles (platform-wide, not org-scoped) ────────────────────
  superuser:
    type: system
    name: Superuser
    description: Full system-wide access to all features
    permissions: "*"

  user:
    type: system
    name: User
    description: Default role assigned to every user on signup
    permissions:
      - organizations:create

  # ── App roles (org/dept-scoped) ─────────────────────────────────────
  analyst:
    type: app
    scope: ORG
    name: Analyst
    description: Read-only access to metrics and roles
    permissions:
      - metrics:list
      - metrics:read
      - metrics:compute
      - roles:list
      - roles:read
      - departments:list
      - departments:read

  org_admin:
    type: app
    scope: ORG
    name: Org Admin
    description: Org-scoped admin for tenancy management
    permissions:
      - organizations:read
      - organizations:update
      - organizations:delete
      - departments:list
      - departments:read
      - departments:create
      - departments:set-default
      - departments:update
      - departments:delete

  dept_admin:
    type: app
    scope: DEPT
    name: Dept Admin
    description: Department-scoped admin for department management
    permissions:
      - departments:read
      - departments:update
      - departments:delete
