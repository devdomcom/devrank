# Pre-commit hooks for code hygiene (Ruff for lint/format, mypy for typing).
# Install with: pre-commit install (after uv sync).
# Uses latest as of 2026.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4  # Latest as of 2026
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0  # Latest as of 2026
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.0.0, types-python-dateutil]
        args: [--no-error-summary]
